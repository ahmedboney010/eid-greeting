<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تهنئة عيد الأضحى المبارك - أسرة القطاع المالي</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
    --gold: #d4af37;
    --dark-gold: #aa841b;
    --military-green: #064e3b;
    --deep-dark: #050b14;
    --cream: #fdfbf7;
    --neon-color: #ffcc00;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Aref Ruqaa', serif;
    background-color: var(--deep-dark);
    color: #fff;
    overflow: hidden;
    height: 100vh;
}

/* الخلفية */
.sheep-container {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 5;
}

.sheep {
    position: absolute;
    top: -50px;
    animation: fall linear infinite;
    font-size: 20px;
}

@keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
}

/* البوابة */
#single-gate {
    position: fixed;
    inset: 0;
    z-index: 999;
    background:
        linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
        url('https://i.ibb.co/35dBR3dy/pngtree-islamic-pilgrimage-to-mecca-eid-adha-mubarak-realistic-kaaba-image-16742354.jpg')
        center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.gate-logo {
    width: 170px;
    margin-bottom: 20px;
}

.gate-title {
    font-size: 3rem;
    color: var(--gold);
}

.gate-desc {
    font-size: 4rem;
    margin: 20px 0;
}

.luxury-btn {
    padding: 15px 50px;
    font-size: 1.4rem;
    border-radius: 40px;
    border: none;
    background: linear-gradient(var(--gold), var(--dark-gold));
    cursor: pointer;
}

/* المحتوى */
.main-content-area {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url('https://images.unsplash.com/photo-1564507592333-c60657eea523?q=80&w=1920') center/cover;
}

.greeting-card-luxury {
    width: 92%;
    max-width: 750px;
    background: rgba(0,0,0,.6);
    padding: 40px;
    border-radius: 25px;
    text-align: center;
}

.inner-logo {
    width: 180px;
    margin-bottom: 20px;
}

.main-headline {
    font-size: 3rem;
}

.sub-headline {
    font-size: 2rem;
    margin: 10px 0;
}

.message-body {
    font-size: 1.6rem;
    line-height: 2;
}

.footer-note {
    font-size: 2rem;
    margin-top: 20px;
    color: var(--gold);
}

/* زر الصوت */
#audio-widget {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 50px;
    height: 50px;
    display: none;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    background: #064e3b;
    color: gold;
}

/* ================== MOBILE ================== */
@media (max-width: 768px) {

    .gate-logo {
        width: 120px;
    }

    .gate-title {
        font-size: 1.8rem;
    }

    .gate-desc {
        font-size: 2.2rem;
    }

    .luxury-btn {
        font-size: 1rem;
        padding: 10px 25px;
    }

    .inner-logo {
        width: 120px;
    }

    .main-headline {
        font-size: 1.8rem;
    }

    .sub-headline {
        font-size: 1.2rem;
    }

    .message-body {
        font-size: 1rem;
        line-height: 1.7;
    }

    .footer-note {
        font-size: 1.3rem;
    }
}
</style>
</head>

<body>

<audio id="takbeerat-player" loop>
    <source src="https://www.nooresunnat.com/Audio/Others/Eid%20Takbeer%20-%20Allahu%20Akbar%20Kabira.MP3">
</audio>

<div class="sheep-container" id="sheepContainer"></div>

<div id="single-gate">
    <img src="https://i.ibb.co/nM3HBG0x/General-services-authority.png" class="gate-logo">
    <h1 class="gate-title">جهاز الخدمات العامة ق.م</h1>
    <div class="gate-desc">القطاع المالي</div>
    <button class="luxury-btn" onclick="openSingleGate()">دخول وسماع التكبيرات</button>
</div>

<div class="main-content-area">
    <div class="greeting-card-luxury">
        <img src="https://i.ibb.co/nM3HBG0x/General-services-authority.png" class="inner-logo">
        <h2 class="main-headline">أسرة القطاع المالى</h2>
        <div class="sub-headline">تهنئكم بعيد الأضحى المبارك</div>

        <p class="message-body">
            بأسمى آيات التهاني والتبريكات الممزوجة بالفخر والاعتزاز...
        </p>

        <div class="footer-note">
            كل عام وأنتم بخير 🌙
        </div>
    </div>
</div>

<div id="audio-widget" onclick="toggleAudioPlayback()">
    🔊
</div>

<script>
const audio = document.getElementById('takbeerat-player');
const gate = document.getElementById('single-gate');
const audioBtn = document.getElementById('audio-widget');

function openSingleGate() {
    audio.play().catch(()=>{});
    gate.style.display = "none";
    audioBtn.style.display = "flex";
}

function toggleAudioPlayback() {
    if(audio.paused){
        audio.play();
    } else {
        audio.pause();
    }
}
</script>

</body>
</html>
